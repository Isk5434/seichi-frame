<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030812"><meta name="description" content="あの場面と、同じ景色を。聖地の写真を探して、比べて、構図を合わせる夜の巡礼ノート。">
  <title>巡礼フレーム — あの場面と、同じ景色を。</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="field-guide.css?v=wallpaper">
  <script defer src="vendor/leaflet.js"></script><script type="module" src="app.js?v=wallpaper"></script>
</head>
<body data-background="city">
  <main>
    <header class="cover">
      <button id="background-open" class="button" type="button" aria-haspopup="dialog" aria-controls="background-dialog">背景</button>
      <div class="cover-copy"><p>巡礼フレーム</p><h1>あの場面と、<br>同じ景色を。</h1></div>
    </header>
    <div class="app-layout" id="pilgrimage-workspace">
      <aside class="places-panel" aria-label="巡礼スポット一覧">
        <div class="places-head"><h2><button id="places-toggle" type="button" aria-expanded="true" aria-controls="places-content">場所を探す</button></h2><button id="locate" class="text-button">現在地</button></div>
        <div id="places-content">
        <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="場所・作品・キーワードで検索" aria-label="場所・作品・キーワードで検索"></label>
        <details class="filters"><summary>絞り込み</summary>
          <label class="select-wrap"><span class="sr-only">PVの編</span><select id="layer"><option value="">すべてのPV・地点</option></select></label>
          <label><input type="checkbox" id="visited-only"> 訪問済み</label>
        </details>
        <p id="result-count" class="sr-only" role="status">読み込み中…</p>
        <div id="spot-list" class="spot-list"></div>
        <p class="aside-note"><span id="sync-status">クラウド同期を確認中…</span><br>通信できない間も端末内に保存します。</p>
        </div>
      </aside>
      <section class="workspace" aria-label="スポットの写真と地図">
        <div class="workspace-head"><nav class="tabs" aria-label="表示モード"><button data-view="map" class="active" aria-pressed="true">地図</button><button data-view="compare" aria-pressed="false">比較</button><button data-view="camera" aria-pressed="false">撮影</button></nav></div>
        <div id="map-view"><div id="map" aria-label="聖地の地図"></div><div class="map-caption"><button id="fit-map" class="text-button">全地点を表示</button></div></div>
        <div id="photo-view" hidden>
          <div class="photo-toolbar"><div id="compare-modes" class="segmented"><button data-mode="side" class="active" aria-pressed="true">横並び</button><button data-mode="overlay" aria-pressed="false">重ねる</button><button data-mode="wipe" aria-pressed="false">スライダー</button></div></div>
          <div id="stage" class="stage side">
            <div class="base-layer"><img id="own-image" alt="自分が撮った写真" hidden><video id="video" autoplay playsinline muted hidden></video><div id="own-empty" class="stage-empty"><span>＋</span><p>自分の写真を選んで<br>参考写真と見比べましょう</p></div><span class="image-label">自分の写真</span></div>
            <div class="reference-layer"><img id="reference-image" alt="選択した地点の参考写真" hidden><div id="reference-empty" class="stage-empty">参考写真を読み込み中…</div><span class="image-label">参考写真</span></div>
            <div id="wipe-line" hidden></div>
          </div>
          <div class="photo-actions"><button id="camera-start" class="button primary" hidden>カメラを起動</button><button id="capture" class="button primary" hidden disabled>この構図で撮影</button><button id="camera-stop" class="button secondary" hidden>カメラを停止</button><button id="download" class="text-button" disabled>写真を保存</button><button id="delete-photo" class="text-button" disabled>選択中の写真を削除</button></div>
          <div id="adjustments" class="adjustments" hidden>
            <label id="opacity-control">参考写真の濃さ <output id="opacity-value">45%</output><input id="opacity" type="range" min="0" max="100" value="45"></label>
            <label id="wipe-control" hidden>比較位置 <output id="wipe-value">50%</output><input id="wipe" type="range" min="0" max="100" value="50"></label>
            <label>参考写真の拡大 <output id="zoom-value">100%</output><input id="zoom" type="range" min="50" max="250" value="100"></label>
            <label>左右位置 <input id="offset-x" aria-label="参考写真の左右位置" type="range" min="-50" max="50" value="0"></label>
            <label>上下位置 <input id="offset-y" aria-label="参考写真の上下位置" type="range" min="-50" max="50" value="0"></label>
            <label>傾き <output id="rotation-value">0°</output><input id="rotation" type="range" min="-30" max="30" value="0" step="0.5"></label><button id="reset" class="text-button">調整をリセット</button>
          </div>
        </div>
        <div class="spot-detail"><div class="spot-title-row"><div><p id="spot-layer" class="eyebrow"></p><h2 id="spot-name">場所を読み込んでいます</h2><p id="administrative-area" class="administrative-area"></p><p id="coordinates" class="coordinates"></p></div><button id="visit" class="visit-button" aria-pressed="false">♡ 訪問済みにする</button></div>
          <div class="detail-links"><a id="directions" target="_blank" rel="noopener noreferrer">Google マップで経路</a><a id="original-photo" target="_blank" rel="noopener noreferrer" hidden>参考写真の配信元</a><label class="text-button file-label">参考画像を端末から選ぶ<input id="reference-file" type="file" accept="image/*" class="sr-only"></label><button id="restore-reference" class="text-button" hidden>元の参考写真に戻す</button></div>
          <div class="gallery-heading"><h3>この場所の参考写真</h3><label class="button add-photo">＋ 写真を追加<input id="own-file" type="file" accept="image/*" multiple class="sr-only"></label></div><div id="gallery" class="gallery"></div>
          <details><summary>元のマップの説明・出典</summary><div id="pv-links" class="pv-links"></div><p id="description" class="description"></p><a id="source-bottom" target="_blank" rel="noopener noreferrer">元のGoogle マイマップを開く</a></details>
        </div>
      </section>
    </div>
    <footer><span>巡礼フレーム <span class="footer-dot">・</span> あなたの旅の、構図ノート。</span><span>参考写真・地点情報の出典：元のGoogle マイマップ</span></footer>
  </main>
  <dialog id="background-dialog" aria-labelledby="background-title">
    <header>
      <h2 id="background-title">背景を選ぶ</h2>
      <form method="dialog"><button class="button" autofocus>閉じる</button></form>
    </header>
    <div class="background-options">
      <button type="button" data-background-choice="city" aria-pressed="true">街の夜景</button>
      <button type="button" data-background-choice="stars" aria-pressed="false">星空</button>
      <button type="button" data-background-choice="solid" aria-pressed="false">単色</button>
    </div>
    <label class="button background-upload">
      端末の写真を選ぶ
      <input id="background-file" type="file" accept="image/*" class="sr-only">
    </label>
    <p id="background-feedback" role="status" hidden></p>
  </dialog>
  <dialog id="photo-preview" class="photo-preview" aria-labelledby="photo-preview-title">
    <div class="photo-preview-content">
      <header>
        <h2 id="photo-preview-title"></h2>
        <form method="dialog"><button class="button" autofocus>閉じる</button></form>
      </header>
      <div class="photo-preview-stage">
        <img id="photo-preview-image" alt="" draggable="false" referrerpolicy="no-referrer">
        <p id="photo-preview-error" role="status" hidden>写真を表示できませんでした。</p>
      </div>
      <footer>
        <button id="photo-preview-prev" class="button" aria-label="前の写真">‹</button>
        <span id="photo-preview-count" aria-live="polite"></span>
        <button id="photo-preview-next" class="button" aria-label="次の写真">›</button>
        <button id="photo-preview-compare" class="button">この写真で比較</button>
      </footer>
    </div>
  </dialog>
  <div id="status" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
